<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 880" width="960" height="880">
  <defs>
    <style>
      .shape { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .comment-line { fill: none; stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4,3; }
      .comment-bracket { fill: none; stroke: #000000; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); }
      .wire { fill: none; stroke: #000000; stroke-width: 1.5; }
      .txt { font-family: "Times New Roman", serif; font-size: 13px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .ctxt { font-family: "Times New Roman", serif; font-size: 12px; fill: #000000; text-anchor: start; dominant-baseline: central; }
      .lbl { font-family: "Times New Roman", serif; font-size: 12px; fill: #000000; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Блок Начало и комментарий аргументов -->
  <rect x="310" y="20" width="260" height="42" rx="21" ry="21" class="shape"/>
  <text x="440" y="41" class="txt">Начало</text>
  <line x1="440" y1="62" x2="440" y2="85" class="arrow"/>

  <line x1="570" y1="41" x2="615" y2="41" class="comment-line"/>
  <polyline points="629,25 615,25 615,57 629,57" class="comment-bracket"/>
  <text x="637" y="34" class="ctxt">Аргументы: массив, искомое значение,</text>
  <text x="637" y="50" class="ctxt">левая и правая границы, глубина и счётчик</text>

  <!-- Увеличение глубины рекурсии -->
  <rect x="310" y="85" width="260" height="40" class="shape"/>
  <text x="440" y="105" class="txt">Увеличить глубину рекурсии на 1</text>
  <line x1="440" y1="125" x2="440" y2="150" class="arrow"/>

  <!-- Условный оператор 1: проверка вырожденности отрезка -->
  <polygon points="440,150 570,188 440,226 310,188" class="shape"/>
  <text x="440" y="180" class="txt">Левая граница больше</text>
  <text x="440" y="197" class="txt">правой границы?</text>

  <!-- Ветка Да (условного оператора 1) -> вернуть -1 -->
  <polyline points="310,188 125,188 125,415" class="arrow"/>
  <text x="275" y="180" class="lbl">Да</text>
  <rect x="15" y="415" width="220" height="40" class="shape"/>
  <text x="125" y="435" class="txt">Вернуть −1</text>

  <!-- Ветка Нет (условного оператора 1) -> вычисление индекса середины -->
  <line x1="440" y1="226" x2="440" y2="252" class="arrow"/>
  <text x="448" y="239" class="lbl">Нет</text>
  <rect x="310" y="252" width="260" height="48" class="shape"/>
  <text x="440" y="268" class="txt">Вычислить индекс</text>
  <text x="440" y="285" class="txt">середины текущего отрезка</text>
  <line x1="440" y1="300" x2="440" y2="326" class="arrow"/>

  <!-- Условный оператор 2: проверка совпадения среднего элемента с искомым -->
  <polygon points="440,326 570,364 440,402 310,364" class="shape"/>
  <text x="440" y="356" class="txt">Средний элемент равен</text>
  <text x="440" y="373" class="txt">искомому значению?</text>

  <!-- Ветка Да (условного оператора 2) -> вернуть индекс середины -->
  <polyline points="570,364 815,364 815,415" class="arrow"/>
  <text x="590" y="356" class="lbl">Да</text>
  <rect x="705" y="415" width="220" height="40" class="shape"/>
  <text x="815" y="435" class="txt">Вернуть индекс середины</text>

  <!-- Ветка Нет (условного оператора 2) -> сравнение среднего элемента с искомым -->
  <line x1="440" y1="402" x2="440" y2="432" class="arrow"/>
  <text x="448" y="417" class="lbl">Нет</text>

  <!-- Условный оператор 3: выбор половины отрезка -->
  <polygon points="440,432 570,470 440,508 310,470" class="shape"/>
  <text x="440" y="462" class="txt">Средний элемент больше</text>
  <text x="440" y="479" class="txt">искомого значения?</text>

  <!-- Ветка Да (условного оператора 3) -> рекурсивный поиск в левой половине -->
  <polyline points="310,470 280,470 280,542" class="arrow"/>
  <text x="288" y="462" class="lbl">Да</text>
  <rect x="160" y="542" width="240" height="76" class="shape"/>
  <line x1="172" y1="542" x2="172" y2="618" stroke="#000000" stroke-width="1.5"/>
  <line x1="388" y1="542" x2="388" y2="618" stroke="#000000" stroke-width="1.5"/>
  <text x="280" y="562" class="txt">Вернуть результат</text>
  <text x="280" y="580" class="txt">рекурсивного поиска</text>
  <text x="280" y="598" class="txt">в левой половине отрезка</text>

  <!-- Ветка Нет (условного оператора 3) -> рекурсивный поиск в правой половине -->
  <polyline points="570,470 600,470 600,542" class="arrow"/>
  <text x="580" y="462" class="lbl">Нет</text>
  <rect x="480" y="542" width="240" height="76" class="shape"/>
  <line x1="492" y1="542" x2="492" y2="618" stroke="#000000" stroke-width="1.5"/>
  <line x1="708" y1="542" x2="708" y2="618" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="562" class="txt">Вернуть результат</text>
  <text x="600" y="580" class="txt">рекурсивного поиска</text>
  <text x="600" y="598" class="txt">в правой половине отрезка</text>

  <!-- Точка слияния ветвей условного оператора 3 -->
  <line x1="280" y1="618" x2="280" y2="660" class="wire"/>
  <line x1="600" y1="618" x2="600" y2="660" class="wire"/>
  <line x1="280" y1="660" x2="600" y2="660" class="wire"/>

  <!-- Точка слияния ветвей условного оператора 2 -->
  <line x1="440" y1="660" x2="440" y2="700" class="wire"/>
  <polyline points="815,455 815,700 440,700" class="wire"/>

  <!-- Точка слияния ветвей условного оператора 1 -> продолжение к блоку Конец -->
  <line x1="627" y1="700" x2="627" y2="742" class="wire"/>
  <polyline points="125,455 125,742 627,742" class="wire"/>
  <line x1="440" y1="742" x2="440" y2="782" class="arrow"/>

  <!-- Блок Конец -->
  <rect x="310" y="782" width="260" height="42" rx="21" ry="21" class="shape"/>
  <text x="440" y="803" class="txt">Конец</text>
</svg>