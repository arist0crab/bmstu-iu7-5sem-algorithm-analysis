<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 820" width="920" height="820">
  <defs>
    <style>
      .shape { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); }
      .wire { fill: none; stroke: #000000; stroke-width: 1.5; }
      .txt { font-family: "Times New Roman", serif; font-size: 13px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .lbl { font-family: "Times New Roman", serif; font-size: 12px; fill: #000000; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Начало (только 1 выход снизу) -> recursionDepth++ (1 вход сверху, 1 выход снизу) -->
  <rect x="320" y="20" width="240" height="42" rx="21" ry="21" class="shape"/>
  <text x="440" y="41" class="txt">Начало</text>
  <line x1="440" y1="62" x2="440" y2="85" class="arrow"/>

  <rect x="320" y="85" width="240" height="38" class="shape"/>
  <text x="440" y="104" class="txt">recursionDepth++</text>
  <line x1="440" y1="123" x2="440" y2="148" class="arrow"/>

  <!-- Решение 1: leftIndex > rightIndex (ромб: 1 вход сверху, 2 выхода: Да влево, Нет вниз) -->
  <polygon points="440,148 560,184 440,220 320,184" class="shape"/>
  <text x="440" y="184" class="txt">leftIndex &gt; rightIndex</text>

  <!-- Ветка Да -> Вернуть -1 (1 вход сверху, 1 выход снизу) -->
  <polyline points="320,184 140,184 140,405" class="arrow"/>
  <text x="285" y="176" class="lbl">Да</text>
  <rect x="20" y="405" width="240" height="38" class="shape"/>
  <text x="140" y="424" class="txt">Вернуть -1</text>

  <!-- Ветка Нет -> middleIndex (1 вход сверху, 1 выход снизу) -->
  <line x1="440" y1="220" x2="440" y2="248" class="arrow"/>
  <text x="448" y="234" class="lbl">Нет</text>
  <rect x="320" y="248" width="240" height="46" class="shape"/>
  <text x="440" y="263" class="txt">middleIndex = leftIndex +</text>
  <text x="440" y="279" class="txt">(rightIndex - leftIndex) / 2</text>
  <line x1="440" y1="294" x2="440" y2="320" class="arrow"/>

  <!-- Решение 2: arr[middleIndex] == elem (ромб: 1 вход сверху, 2 выхода: Да вправо, Нет вниз) -->
  <polygon points="440,320 560,356 440,392 320,356" class="shape"/>
  <text x="440" y="356" class="txt">arr[middleIndex] == elem</text>

  <!-- Ветка Да -> Вернуть middleIndex (1 вход сверху, 1 выход снизу) -->
  <polyline points="560,356 780,356 780,405" class="arrow"/>
  <text x="580" y="348" class="lbl">Да</text>
  <rect x="660" y="405" width="240" height="38" class="shape"/>
  <text x="780" y="424" class="txt">Вернуть middleIndex</text>

  <!-- Ветка Нет -> Решение 3: arr[middleIndex] > elem (ромб: 1 вход сверху, 2 выхода: Да влево, Нет вправо) -->
  <line x1="440" y1="392" x2="440" y2="422" class="arrow"/>
  <text x="448" y="406" class="lbl">Нет</text>
  <polygon points="440,422 560,458 440,494 320,458" class="shape"/>
  <text x="440" y="458" class="txt">arr[middleIndex] &gt; elem</text>

  <!-- Ветка Да -> левый предопределённый процесс (1 вход сверху, 1 выход снизу) -->
  <polyline points="320,458 290,458 290,530" class="arrow"/>
  <text x="298" y="450" class="lbl">Да</text>
  <rect x="170" y="530" width="240" height="72" class="shape"/>
  <line x1="182" y1="530" x2="182" y2="602" stroke="#000000" stroke-width="1.5"/>
  <line x1="398" y1="530" x2="398" y2="602" stroke="#000000" stroke-width="1.5"/>
  <text x="290" y="549" class="txt">Вернуть</text>
  <text x="290" y="566" class="txt">binRecursionIteration(...,</text>
  <text x="290" y="583" class="txt">leftIndex, middleIndex - 1)</text>

  <!-- Ветка Нет -> правый предопределённый процесс (1 вход сверху, 1 выход снизу) -->
  <polyline points="560,458 590,458 590,530" class="arrow"/>
  <text x="570" y="450" class="lbl">Нет</text>
  <rect x="470" y="530" width="240" height="72" class="shape"/>
  <line x1="482" y1="530" x2="482" y2="602" stroke="#000000" stroke-width="1.5"/>
  <line x1="698" y1="530" x2="698" y2="602" stroke="#000000" stroke-width="1.5"/>
  <text x="590" y="549" class="txt">Вернуть</text>
  <text x="590" y="566" class="txt">binRecursionIteration(...,</text>
  <text x="590" y="583" class="txt">middleIndex + 1, rightIndex)</text>

  <!-- Все 4 ветки (Вернуть -1 на x=140, левый вызов на x=290, правый вызов на x=590,
       Вернуть middleIndex на x=780) приходят в одну общую горизонтальную линию y=700,
       от которой идёт одна вертикальная стрелка вниз в верхнюю границу блока Конец (y=734) -->
  <line x1="140" y1="443" x2="140" y2="700" class="wire"/>
  <line x1="290" y1="602" x2="290" y2="700" class="wire"/>
  <line x1="590" y1="602" x2="590" y2="700" class="wire"/>
  <line x1="780" y1="443" x2="780" y2="700" class="wire"/>
  <line x1="140" y1="700" x2="780" y2="700" class="wire"/>
  <line x1="440" y1="700" x2="440" y2="734" class="arrow"/>

  <!-- Конец (только 1 вход сверху, без исходящих линий) -->
  <rect x="320" y="734" width="240" height="42" rx="21" ry="21" class="shape"/>
  <text x="440" y="755" class="txt">Конец</text>
</svg>