<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1030" width="880" height="1030">
  <defs>
    <style>
      .shape { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .line { fill: none; stroke: #000000; stroke-width: 1.5; }
      .txt { font-family: "Times New Roman", serif; font-size: 13px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .lbl { font-family: "Times New Roman", serif; font-size: 12px; fill: #000000; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Единая ширина всех блоков: 240px (главная ось X = 390) -->

  <!-- Терминатор: Начало -->
  <rect x="270" y="15" width="240" height="42" rx="21" ry="21" class="shape"/>
  <text x="390" y="36" class="txt">Начало</text>
  <line x1="390" y1="57" x2="390" y2="78" class="line"/>

  <!-- Процесс: iterQuantity = 0 -->
  <rect x="270" y="78" width="240" height="36" class="shape"/>
  <text x="390" y="96" class="txt">iterQuantity = 0</text>
  <line x1="390" y1="114" x2="390" y2="134" class="line"/>

  <!-- Решение 1: arr == nullptr || arrSize == 0 -->
  <polygon points="390,134 510,170 390,206 270,170" class="shape"/>
  <text x="390" y="170" class="txt">arr == nullptr || arrSize == 0</text>

  <!-- Ветка Да (вправо -> return -1, блок шириной 240px: x=615..855, центр=735) -->
  <line x1="510" y1="170" x2="735" y2="170" class="line"/>
  <text x="530" y="162" class="lbl">Да</text>
  <line x1="735" y1="170" x2="735" y2="215" class="line"/>
  <rect x="615" y="215" width="240" height="36" class="shape"/>
  <text x="735" y="233" class="txt">Вернуть -1</text>
  <line x1="735" y1="251" x2="735" y2="978" class="line"/>
  <line x1="735" y1="978" x2="510" y2="978" class="line" marker-end="url(#arrow)"/>

  <!-- Ветка Нет (вниз) -->
  <line x1="390" y1="206" x2="390" y2="228" class="line"/>
  <text x="398" y="217" class="lbl">Нет</text>

  <!-- Процесс: beginIndex, step -->
  <rect x="270" y="228" width="240" height="46" class="shape"/>
  <text x="390" y="243" class="txt">beginIndex = 0</text>
  <text x="390" y="261" class="txt">step = bit_ceil(arrSize) / 2</text>
  <line x1="390" y1="274" x2="390" y2="296" class="line"/>

  <!-- Граница цикла (начало) -->
  <polygon points="285,296 495,296 510,311 510,342 270,342 270,311" class="shape"/>
  <text x="390" y="311" class="txt">Цикл step</text>
  <text x="390" y="328" class="txt">step != 0; step /= 2</text>
  <line x1="390" y1="342" x2="390" y2="365" class="line"/>

  <!-- Решение 2: beginIndex + step < arrSize -->
  <polygon points="390,365 510,400 390,435 270,400" class="shape"/>
  <text x="390" y="400" class="txt">beginIndex + step &lt; arrSize</text>

  <!-- Ветка Нет (обход влево) -->
  <line x1="270" y1="400" x2="205" y2="400" class="line"/>
  <text x="235" y="392" class="lbl">Нет</text>
  <line x1="205" y1="400" x2="205" y2="640" class="line"/>
  <line x1="205" y1="640" x2="390" y2="640" class="line"/>

  <!-- Ветка Да (вниз) -->
  <line x1="390" y1="435" x2="390" y2="455" class="line"/>
  <text x="398" y="445" class="lbl">Да</text>

  <!-- Процесс: iterQuantity++ -->
  <rect x="270" y="455" width="240" height="34" class="shape"/>
  <text x="390" y="472" class="txt">iterQuantity++</text>
  <line x1="390" y1="489" x2="390" y2="510" class="line"/>

  <!-- Решение 3: arr[beginIndex + step] < elem -->
  <polygon points="390,510 510,545 390,580 270,545" class="shape"/>
  <text x="390" y="545" class="txt">arr[beginIndex + step] &lt; elem</text>

  <!-- Да (вправо -> блок шириной 240px: x=475..715, центр=595) -->
  <line x1="510" y1="545" x2="595" y2="545" class="line"/>
  <text x="528" y="537" class="lbl">Да</text>
  <line x1="595" y1="545" x2="595" y2="572" class="line"/>
  <rect x="475" y="572" width="240" height="36" class="shape"/>
  <text x="595" y="590" class="txt">beginIndex += step</text>
  <line x1="595" y1="608" x2="595" y2="625" class="line"/>
  <line x1="595" y1="625" x2="390" y2="625" class="line"/>

  <!-- Нет (вниз) -->
  <line x1="390" y1="580" x2="390" y2="660" class="line"/>
  <text x="398" y="593" class="lbl">Нет</text>

  <!-- Граница цикла (конец) -->
  <polygon points="270,660 510,660 510,691 495,706 285,706 270,691" class="shape"/>
  <text x="390" y="683" class="txt">Цикл step</text>
  <line x1="390" y1="706" x2="390" y2="727" class="line"/>

  <!-- Процесс: pos = ... -->
  <rect x="270" y="727" width="240" height="44" class="shape"/>
  <text x="390" y="741" class="txt">pos = beginIndex +</text>
  <text x="390" y="757" class="txt">(arr[beginIndex] &lt; elem ? 1 : 0)</text>
  <line x1="390" y1="771" x2="390" y2="792" class="line"/>

  <!-- Решение 4: pos < arrSize && arr[pos] == elem -->
  <polygon points="390,792 510,828 390,864 270,828" class="shape"/>
  <text x="390" y="828" class="txt">pos &lt; arrSize &amp;&amp; arr[pos] == elem</text>

  <!-- Да (влево -> return pos, блок шириной 240px: x=20..260, центр=140) -->
  <line x1="270" y1="828" x2="140" y2="828" class="line"/>
  <text x="235" y="820" class="lbl">Да</text>
  <line x1="140" y1="828" x2="140" y2="875" class="line"/>
  <rect x="20" y="875" width="240" height="36" class="shape"/>
  <text x="140" y="893" class="txt">Вернуть pos</text>
  <line x1="140" y1="911" x2="140" y2="978" class="line"/>
  <line x1="140" y1="978" x2="270" y2="978" class="line" marker-end="url(#arrow)"/>

  <!-- Нет (вниз -> return -1) -->
  <line x1="390" y1="864" x2="390" y2="882" class="line"/>
  <text x="398" y="873" class="lbl">Нет</text>
  <rect x="270" y="882" width="240" height="36" class="shape"/>
  <text x="390" y="900" class="txt">Вернуть -1</text>
  <line x1="390" y1="918" x2="390" y2="957" class="line"/>

  <!-- Терминатор: Конец -->
  <rect x="270" y="957" width="240" height="42" rx="21" ry="21" class="shape"/>
  <text x="390" y="978" class="txt">Конец</text>
</svg>