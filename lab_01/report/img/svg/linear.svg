<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" width="680" height="620">
  <defs>
    <style>
      .shape { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); }
      .wire { fill: none; stroke: #000000; stroke-width: 1.5; }
      .txt { font-family: "Times New Roman", serif; font-size: 13px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .lbl { font-family: "Times New Roman", serif; font-size: 12px; fill: #000000; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Начало (только 1 выход снизу) -> Цикл i (начало) (1 вход сверху) -->
  <rect x="90" y="20" width="240" height="44" rx="22" ry="22" class="shape"/>
  <text x="210" y="42" class="txt">Начало</text>
  <line x1="210" y1="64" x2="210" y2="95" class="arrow"/>

  <!-- Граница цикла (начало) (1 вход, 1 выход) -> iterQuantity++ -->
  <polygon points="105,95 315,95 330,110 330,145 90,145 90,110" class="shape"/>
  <text x="210" y="114" class="txt">Цикл i</text>
  <text x="210" y="131" class="txt">i = 0; i &lt; arrSize; ++i</text>
  <line x1="210" y1="145" x2="210" y2="175" class="arrow"/>

  <!-- iterQuantity++ (1 вход, 1 выход) -> Решение: arr[i] == elem -->
  <rect x="90" y="175" width="240" height="40" class="shape"/>
  <text x="210" y="195" class="txt">iterQuantity++</text>
  <line x1="210" y1="215" x2="210" y2="245" class="arrow"/>

  <!-- Решение: arr[i] == elem (ромб: 1 вход сверху, 2 выхода: Да вправо, Нет вниз) -->
  <polygon points="210,245 330,285 210,325 90,285" class="shape"/>
  <text x="210" y="285" class="txt">arr[i] == elem</text>

  <!-- Ветка Да -> Вернуть i (1 вход сверху, 1 выход снизу) -->
  <polyline points="330,285 505,285 505,335" class="arrow"/>
  <text x="348" y="277" class="lbl">Да</text>
  <rect x="385" y="335" width="240" height="40" class="shape"/>
  <text x="505" y="355" class="txt">Вернуть i</text>

  <!-- Ветка Нет -> Граница цикла (конец) (1 вход сверху, 1 выход снизу) -->
  <line x1="210" y1="325" x2="210" y2="375" class="arrow"/>
  <text x="218" y="345" class="lbl">Нет</text>
  <polygon points="90,375 330,375 330,410 315,425 105,425 90,410" class="shape"/>
  <text x="210" y="400" class="txt">Цикл i</text>

  <!-- Граница цикла (конец) -> Вернуть -1 (1 вход сверху, 1 выход снизу) -->
  <line x1="210" y1="425" x2="210" y2="465" class="arrow"/>
  <rect x="90" y="465" width="240" height="40" class="shape"/>
  <text x="210" y="485" class="txt">Вернуть -1</text>

  <!-- Единственный выход из Вернуть -1 (y=505) и единственный выход из Вернуть i (y=375)
       сводятся на одном уровне y=528 в общую вертикаль к Конец (1 вход сверху) -->
  <line x1="210" y1="505" x2="210" y2="528" class="wire"/>
  <polyline points="505,375 505,528 210,528" class="wire"/>
  <line x1="210" y1="528" x2="210" y2="550" class="arrow"/>

  <!-- Конец (только 1 вход сверху, без исходящих линий) -->
  <rect x="90" y="550" width="240" height="44" rx="22" ry="22" class="shape"/>
  <text x="210" y="572" class="txt">Конец</text>
</svg>