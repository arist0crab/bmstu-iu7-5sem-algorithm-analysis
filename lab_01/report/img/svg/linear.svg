<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640">
  <defs>
    <!-- Единые стили оформления блоков и линий -->
    <style>
      .shape { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .comment-line { fill: none; stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4,3; }
      .comment-bracket { fill: none; stroke: #000000; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); }
      .wire { fill: none; stroke: #000000; stroke-width: 1.5; }
      .txt { font-family: "Times New Roman", serif; font-size: 13px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .ctxt { font-family: "Times New Roman", serif; font-size: 12px; fill: #000000; text-anchor: start; dominant-baseline: central; }
      .lbl { font-family: "Times New Roman", serif; font-size: 12px; fill: #000000; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Блок Начало и выносной комментарий аргументов -->
  <rect x="80" y="20" width="250" height="44" rx="22" ry="22" class="shape"/>
  <text x="205" y="42" class="txt">Начало</text>
  <line x1="205" y1="64" x2="205" y2="95" class="arrow"/>

  <line x1="330" y1="42" x2="375" y2="42" class="comment-line"/>
  <polyline points="389,26 375,26 375,58 389,58" class="comment-bracket"/>
  <text x="397" y="35" class="ctxt">Аргументы: массив, длина массива,</text>
  <text x="397" y="51" class="ctxt">искомое значение, счётчик сравнений</text>

  <!-- Начало цикла перебора элементов -->
  <polygon points="95,95 315,95 330,110 330,148 80,148 80,110" class="shape"/>
  <text x="205" y="114" class="txt">Цикл по индексу элемента</text>
  <text x="205" y="131" class="txt">от 0 до (длина массива − 1)</text>
  <line x1="205" y1="148" x2="205" y2="178" class="arrow"/>

  <!-- Увеличение счётчика сравнений -->
  <rect x="80" y="178" width="250" height="44" class="shape"/>
  <text x="205" y="192" class="txt">Увеличить счётчик</text>
  <text x="205" y="208" class="txt">сравнений на 1</text>
  <line x1="205" y1="222" x2="205" y2="252" class="arrow"/>

  <!-- Проверка совпадения текущего элемента с искомым -->
  <polygon points="205,252 330,294 205,336 80,294" class="shape"/>
  <text x="205" y="286" class="txt">Текущий элемент равен</text>
  <text x="205" y="303" class="txt">искомому значению?</text>

  <!-- Ветка Да -> возврат найденного индекса -->
  <polyline points="330,294 525,294 525,345" class="arrow"/>
  <text x="348" y="286" class="lbl">Да</text>
  <rect x="400" y="345" width="250" height="44" class="shape"/>
  <text x="525" y="367" class="txt">Вернуть текущий индекс</text>

  <!-- Ветка Нет -> конец цикла -->
  <line x1="205" y1="336" x2="205" y2="386" class="arrow"/>
  <text x="214" y="356" class="lbl">Нет</text>
  <polygon points="80,386 330,386 330,422 315,436 95,436 80,422" class="shape"/>
  <text x="205" y="411" class="txt">Конец цикла по индексу</text>

  <!-- Возврат -1 при отсутствии элемента -->
  <line x1="205" y1="436" x2="205" y2="475" class="arrow"/>
  <rect x="80" y="475" width="250" height="42" class="shape"/>
  <text x="205" y="496" class="txt">Вернуть −1</text>

  <!-- Объединение потоков к блоку Конец -->
  <line x1="205" y1="517" x2="205" y2="542" class="wire"/>
  <polyline points="525,389 525,542 205,542" class="wire"/>
  <line x1="205" y1="542" x2="205" y2="565" class="arrow"/>

  <!-- Блок Конец -->
  <rect x="80" y="565" width="250" height="44" rx="22" ry="22" class="shape"/>
  <text x="205" y="587" class="txt">Конец</text>
</svg>