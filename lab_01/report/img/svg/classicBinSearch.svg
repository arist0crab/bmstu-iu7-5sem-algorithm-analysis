<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" width="1000" height="840">
  <defs>
    <style>
      .shape { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .line { fill: none; stroke: #000000; stroke-width: 1.5; }
      .txt { font-family: "Times New Roman", serif; font-size: 13px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .lbl { font-family: "Times New Roman", serif; font-size: 12px; fill: #000000; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Единая ширина всех блоков: 240px (главная ось X = 420) -->

  <!-- Терминатор: Начало -->
  <rect x="300" y="20" width="240" height="42" rx="21" ry="21" class="shape"/>
  <text x="420" y="41" class="txt">Начало</text>
  <line x1="420" y1="62" x2="420" y2="85" class="line"/>

  <!-- Процесс: Инициализация -->
  <rect x="300" y="85" width="240" height="58" class="shape"/>
  <text x="420" y="100" class="txt">iterQuantity = 0</text>
  <text x="420" y="115" class="txt">start_ind = 0</text>
  <text x="420" y="130" class="txt">end_ind = arrSize - 1</text>
  <line x1="420" y1="143" x2="420" y2="170" class="line"/>

  <!-- Решение цикла while -->
  <polygon points="420,170 540,208 420,246 300,208" class="shape"/>
  <text x="420" y="208" class="txt">start_ind &lt;= end_ind</text>

  <!-- Выход Нет (влево к return -1 с большим запасом от блока start_ind = cur_ind + 1) -->
  <line x1="300" y1="208" x2="65" y2="208" class="line"/>
  <text x="260" y="200" class="lbl">Нет</text>
  <line x1="65" y1="208" x2="65" y2="700" class="line"/>
  <line x1="65" y1="700" x2="300" y2="700" class="line" marker-end="url(#arrow)"/>

  <!-- Вход Да (вниз) -->
  <line x1="420" y1="246" x2="420" y2="272" class="line"/>
  <text x="428" y="261" class="lbl">Да</text>

  <!-- Процесс: iterQuantity++, cur_ind -->
  <rect x="300" y="272" width="240" height="52" class="shape"/>
  <text x="420" y="287" class="txt">iterQuantity++</text>
  <text x="420" y="303" class="txt">cur_ind = (end_ind - start_ind) / 2</text>
  <text x="420" y="317" class="txt">+ start_ind</text>
  <line x1="420" y1="324" x2="420" y2="348" class="line"/>

  <!-- Решение 1: arr[cur_ind] < elem -->
  <polygon points="420,348 540,385 420,422 300,385" class="shape"/>
  <text x="420" y="385" class="txt">arr[cur_ind] &lt; elem</text>

  <!-- Ветка Да (влево -> блок шириной 240px: x=100..340) -->
  <line x1="300" y1="385" x2="220" y2="385" class="line"/>
  <text x="265" y="377" class="lbl">Да</text>
  <line x1="220" y1="385" x2="220" y2="440" class="line"/>
  <rect x="100" y="440" width="240" height="40" class="shape"/>
  <text x="220" y="460" class="txt">start_ind = cur_ind + 1</text>

  <!-- Ветка Нет (вправо -> ромб шириной 240px: x=470..710, центр=590) -->
  <line x1="540" y1="385" x2="590" y2="385" class="line"/>
  <text x="552" y="377" class="lbl">Нет</text>
  <line x1="590" y1="385" x2="590" y2="418" class="line"/>

  <!-- Решение 2: arr[cur_ind] > elem -->
  <polygon points="590,418 710,455 590,492 470,455" class="shape"/>
  <text x="590" y="455" class="txt">arr[cur_ind] &gt; elem</text>

  <!-- Ветка Да (вниз -> блок шириной 240px: x=470..710) -->
  <line x1="590" y1="492" x2="590" y2="525" class="line"/>
  <text x="598" y="508" class="lbl">Да</text>
  <rect x="470" y="525" width="240" height="40" class="shape"/>
  <text x="590" y="545" class="txt">end_ind = cur_ind - 1</text>

  <!-- Ветка Нет (вправо -> return cur_ind, блок шириной 240px: x=735..975, центр=855) -->
  <line x1="710" y1="455" x2="855" y2="455" class="line"/>
  <text x="725" y="447" class="lbl">Нет</text>
  <line x1="855" y1="455" x2="855" y2="615" class="line"/>
  <rect x="735" y="615" width="240" height="40" class="shape"/>
  <text x="855" y="635" class="txt">Вернуть cur_ind</text>
  <line x1="855" y1="655" x2="855" y2="780" class="line"/>
  <line x1="855" y1="780" x2="540" y2="780" class="line" marker-end="url(#arrow)"/>

  <!-- Объединение веток цикла и возврат наверх -->
  <line x1="220" y1="480" x2="220" y2="595" class="line"/>
  <line x1="590" y1="565" x2="590" y2="595" class="line"/>
  <line x1="220" y1="595" x2="590" y2="595" class="line"/>
  <line x1="420" y1="595" x2="420" y2="622" class="line"/>
  <line x1="420" y1="622" x2="30" y2="622" class="line"/>
  <line x1="30" y1="622" x2="30" y2="156" class="line"/>
  <line x1="30" y1="156" x2="420" y2="156" class="line" marker-end="url(#arrow)"/>

  <!-- Процесс: Вернуть -1 -->
  <rect x="300" y="680" width="240" height="40" class="shape"/>
  <text x="420" y="700" class="txt">Вернуть -1</text>
  <line x1="420" y1="720" x2="420" y2="759" class="line"/>

  <!-- Терминатор: Конец -->
  <rect x="300" y="759" width="240" height="42" rx="21" ry="21" class="shape"/>
  <text x="420" y="780" class="txt">Конец</text>
</svg>