<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1090" width="940" height="1090">
  <defs>
    <!-- Единые стили оформления блоков, комментариев и соединительных линий -->
    <style>
      .shape { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .comment-line { fill: none; stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4,3; }
      .comment-bracket { fill: none; stroke: #000000; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); }
      .wire { fill: none; stroke: #000000; stroke-width: 1.5; }
      .txt { font-family: "Times New Roman", serif; font-size: 13px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .ctxt { font-family: "Times New Roman", serif; font-size: 12px; fill: #000000; text-anchor: start; dominant-baseline: central; }
      .lbl { font-family: "Times New Roman", serif; font-size: 12px; fill: #000000; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Блок Начало и комментарий аргументов -->
  <rect x="180" y="20" width="260" height="42" rx="21" ry="21" class="shape"/>
  <text x="310" y="41" class="txt">Начало</text>
  <line x1="310" y1="62" x2="310" y2="96" class="arrow"/>

  <line x1="440" y1="41" x2="485" y2="41" class="comment-line"/>
  <polyline points="499,25 485,25 485,57 499,57" class="comment-bracket"/>
  <text x="507" y="34" class="ctxt">Аргументы: отсортированный массив,</text>
  <text x="507" y="50" class="ctxt">длина массива, искомое значение, счётчик сравнений</text>

  <!-- Обнуление счётчика сравнений -->
  <rect x="180" y="96" width="260" height="38" class="shape"/>
  <text x="310" y="115" class="txt">Обнулить счётчик сравнений</text>
  <line x1="310" y1="134" x2="310" y2="158" class="arrow"/>

  <!-- Инициализация левой границы -->
  <rect x="180" y="158" width="260" height="38" class="shape"/>
  <text x="310" y="177" class="txt">Левая граница = 0</text>
  <line x1="310" y1="196" x2="310" y2="220" class="arrow"/>

  <!-- Инициализация правой границы -->
  <rect x="180" y="220" width="260" height="38" class="shape"/>
  <text x="310" y="239" class="txt">Правая граница = длина массива − 1</text>
  <line x1="310" y1="258" x2="310" y2="282" class="arrow"/>

  <!-- Заголовок цикла поиска -->
  <polygon points="195,282 425,282 440,297 440,330 180,330 180,297" class="shape"/>
  <text x="310" y="298" class="txt">Цикл пока левая граница</text>
  <text x="310" y="315" class="txt">не превышает правую границу</text>
  <line x1="310" y1="330" x2="310" y2="354" class="arrow"/>

  <!-- Увеличение счётчика сравнений -->
  <rect x="180" y="354" width="260" height="40" class="shape"/>
  <text x="310" y="374" class="txt">Увеличить счётчик сравнений на 1</text>
  <line x1="310" y1="394" x2="310" y2="418" class="arrow"/>

  <!-- Вычисление индекса середины отрезка -->
  <rect x="180" y="418" width="260" height="54" class="shape"/>
  <text x="310" y="436" class="txt">Вычислить индекс</text>
  <text x="310" y="454" class="txt">середины текущего отрезка</text>
  <line x1="310" y1="472" x2="310" y2="498" class="arrow"/>

  <!-- Условие 1: средний элемент меньше искомого -->
  <polygon points="310,498 440,536 310,574 180,536" class="shape"/>
  <text x="310" y="528" class="txt">Средний элемент меньше</text>
  <text x="310" y="545" class="txt">искомого значения?</text>

  <!-- Ветка Да -> сдвиг левой границы -->
  <polyline points="440,536 730,536 730,636" class="arrow"/>
  <text x="458" y="528" class="lbl">Да</text>
  <rect x="605" y="636" width="250" height="46" class="shape"/>
  <text x="730" y="651" class="txt">Сдвинуть левую границу</text>
  <text x="730" y="667" class="txt">правее середины на 1</text>

  <!-- Ветка Нет -> Условие 2: средний элемент больше искомого -->
  <line x1="310" y1="574" x2="310" y2="606" class="arrow"/>
  <text x="290" y="590" class="lbl" text-anchor="end">Нет</text>
  <polygon points="310,606 440,644 310,682 180,644" class="shape"/>
  <text x="310" y="636" class="txt">Средний элемент больше</text>
  <text x="310" y="653" class="txt">искомого значения?</text>

  <!-- Ветка Да -> сдвиг правой границы -->
  <polyline points="440,644 460,644 460,694" class="arrow"/>
  <text x="450" y="636" class="lbl">Да</text>
  <rect x="335" y="694" width="250" height="46" class="shape"/>
  <text x="460" y="709" class="txt">Сдвинуть правую границу</text>
  <text x="460" y="725" class="txt">левее середины на 1</text>

  <!-- Слияние веток сдвига границ к концу цикла -->
  <line x1="460" y1="740" x2="460" y2="762" class="wire"/>
  <line x1="730" y1="682" x2="730" y2="762" class="wire"/>
  <line x1="460" y1="762" x2="730" y2="762" class="wire"/>
  <line x1="595" y1="762" x2="595" y2="782" class="arrow"/>

  <!-- Конец цикла -->
  <polygon points="470,782 720,782 720,808 705,824 485,824 470,808" class="shape"/>
  <text x="595" y="803" class="txt">Конец цикла поиска</text>
  <line x1="595" y1="824" x2="595" y2="852" class="arrow"/>

  <!-- Возврат -1 -->
  <rect x="470" y="852" width="250" height="40" class="shape"/>
  <text x="595" y="872" class="txt">Вернуть −1</text>

  <!-- Ветка Нет (элемент найден) -> возврат индекса середины -->
  <polyline points="310,682 310,852" class="arrow"/>
  <text x="290" y="698" class="lbl" text-anchor="end">Нет</text>
  <rect x="185" y="852" width="250" height="40" class="shape"/>
  <text x="310" y="872" class="txt">Вернуть индекс середины</text>

  <!-- Слияние к блоку Конец -->
  <line x1="310" y1="892" x2="310" y2="920" class="wire"/>
  <line x1="595" y1="892" x2="595" y2="920" class="wire"/>
  <line x1="310" y1="920" x2="595" y2="920" class="wire"/>
  <line x1="452" y1="920" x2="452" y2="945" class="arrow"/>

  <!-- Блок Конец -->
  <rect x="332" y="945" width="240" height="42" rx="21" ry="21" class="shape"/>
  <text x="452" y="966" class="txt">Конец</text>
</svg>